description: >-
  FinOps view of Plane spend. Plane is not metered per API call; cost is driven
  by seats. Self-hosting the open-source Community Edition (AGPL v3.0) has no
  license fee, so cost is the underlying infrastructure you run it on. Plane
  Cloud bills per Admin/Member seat (Free up to 12 seats, Pro, Business), with
  Guests free at 5 per paid seat, and a custom Enterprise plan. The Commercial
  self-hosted edition is also per seat. Optimization is primarily a matter of
  seat allocation and choosing self-hosted vs. managed.
notes: >-
  Per-seat rates are subject to change; verify against the Plane pricing page
  during reconciliation. The REST API does not incur separate usage charges.

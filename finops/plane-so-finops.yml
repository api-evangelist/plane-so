meters:
- name: paid_seats
  description: Admin and Member seats billed per month per Cloud or Commercial plan.
  unit: seats
  aggregation: sum
  dimensions:
  - workspace
  - plan
- name: guest_seats
  description: Guest seats, free at 5 per paid seat; tracked for allocation, not billed.
  unit: seats
  aggregation: sum
  dimensions:
  - workspace
- name: self_hosted_infrastructure
  description: Compute, storage, and database cost of running the self-hosted Community or Commercial Edition.
  unit: hours
  aggregation: sum
  dimensions:
  - instance
  - environment
principles:
- name: Visibility
  description: Track active Admin/Member seats per workspace against the plan; for self-hosted, monitor underlying infrastructure spend.
- name: Allocation
  description: Map workspaces and projects to teams and cost centers; use the free Guest allowance for external collaborators.
- name: Optimization
  description: Right-size seat counts, reclaim inactive seats, and evaluate self-hosting the free Community Edition versus managed Cloud based on team size and ops capacity.
- name: Accountability
  description: Assign workspace owners; review seat counts and plan tier on the annual billing cycle.

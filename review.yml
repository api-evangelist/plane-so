sources:
  - url: https://developers.plane.so/api-reference/introduction
    type: APIReference
    note: Documents REST base URL https://api.plane.so/api/v1, X-API-Key auth, and 60 requests/minute rate limit. No WebSocket mentioned.
  - url: https://developers.plane.so/api-reference/project/overview
    type: Documentation
    note: Project, work item, cycle, module, state, label, and member resources are all REST/HTTPS.
  - url: https://developers.plane.so/api-reference/cycle/overview
    type: Documentation
    note: Cycle and cycle work-item endpoints are HTTPS REST with archive/unarchive/transfer actions.
  - url: https://github.com/makeplane/plane
    type: SourceCode
    note: Open-source repository; realtime collaboration is internal to the app and not exposed as a public WebSocket API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public WebSocket or other event-stream protocol surface is documented,
    so no AsyncAPI document was authored. The apis.yml catalog models the
    documented REST surface across Projects, Issues, Cycles, Modules,
    States/Labels, and Members.

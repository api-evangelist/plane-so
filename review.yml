aid: plane-so
name: Plane
review:
  question: Does Plane expose a documented public WebSocket API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. Plane's public developer API
    (https://api.plane.so/api/v1) is a synchronous REST/HTTPS interface. No
    documented public WebSocket, Server-Sent Events, or other event-stream
    surface is published in the API reference as of the review date, so there
    is no in-scope async transport to model.
findings:
  summary: |
    Plane does not publish a documented public WebSocket API. The public
    developer API is REST over HTTPS, scoped to a workspace and project, and
    authenticated with an X-API-Key header. The Plane application uses realtime
    collaboration internally (for live editing and presence), but no public,
    documented WebSocket (ws:// or wss://) endpoint is exposed for third-party
    integration in the developer documentation. Integration with external
    events is instead handled through webhooks configured in the workspace
    settings, not through a client-facing streaming API.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.plane.so/api/v1
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No public WebSocket endpoint is documented in Plane's API reference. Internal realtime collaboration exists in the app but is not exposed as a public API.

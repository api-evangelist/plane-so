name: Plane
kind: company
description: Plane is an open-source project and product management tool for planning,
  tracking, and shipping work across workspaces, projects, cycles, and modules. It
  is available as a self-hosted Community Edition (AGPL v3.0) and as Plane Cloud, and
  exposes a REST API at https://api.plane.so/api/v1 secured with an X-API-Key header
  for managing projects, work items, cycles, modules, states, labels, and members.
